<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial Oficial - CETis No. 116</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #070b14;
            color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        /* Proporción exacta CR-80 Vertical para tarjeta PVC (54mm x 85.6mm) -> 270px por 428px */
        .cr80-card-vertical {
            width: 270px;
            height: 428px;
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            position: relative;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        .btn-gold {
            background: linear-gradient(135deg, #d4b26f 0%, #c59b4d 100%);
            color: #1a1205;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #e0c283 0%, #d1a95b 100%);
        }
        
        /* REGLAS ESTRICTAS DE IMPRESIÓN EXCLUSIVA (EVITA HOJAS EN BLANCO Y DIVISIÓN) */
        @media print {
            @page {
                size: 54mm 85.6mm;
                margin: 0 !important;
            }
            html, body {
                width: 54mm !important;
                height: 85.6mm !important;
                background: none !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
            }
            body * {
                display: none !important;
            }
            #areaImpresion, #areaImpresion * {
                display: block !important;
                visibility: visible !important;
            }
            #areaImpresion {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 54mm !important;
                height: 85.6mm !important;
                margin: 0 !important;
                padding: 0 !important;
                z-index: 99999;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Barra Superior de Navegación (Oculta al imprimir) -->
    <div class="no-print w-full max-w-[270px] flex justify-between items-center mb-4">
        <a href="index.html" class="text-xs bg-slate-900 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-xl transition font-semibold shadow">
            ⬅ Padrón
        </a>
        <a id="linkReverso" href="reverso.html" class="text-xs bg-slate-900 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-xl transition font-semibold shadow">
            Ver Reverso ➡
        </a>
    </div>

    <!-- CONTENEDOR EXCLUSIVO PARA IMPRESIÓN (EVITA PAGINACIÓN DOBLE) -->
    <div id="areaImpresion">
        <!-- TARJETA CR-80 VERTICAL (ANVERSO OFICIAL) -->
        <div class="cr80-card-vertical rounded-xl shadow-2xl border border-slate-300 overflow-hidden flex flex-col justify-between select-none mx-auto">
            
            <!-- ENCABEZADO INSTITUCIONAL SUPERIOR (TÍTULOS AGRANDADOS Y LOGOS NÍTIDOS) -->
            <div class="bg-[#4a0e1e] text-white px-2.5 py-2 border-b-2 border-[#c59b4d] flex items-center justify-between gap-1 shadow-md">
                <!-- Logo DGETI -->
                <div class="w-11 h-11 bg-white/95 rounded-lg p-1 flex items-center justify-center flex-shrink-0 shadow border border-amber-400/50">
                    <img src="logotipodgti.png" alt="DGETI" class="w-full h-full object-contain">
                </div>
                
                <!-- Textos Centrales Más Grandes y Claros -->
                <div class="text-center flex-grow leading-tight px-0.5">
                    <p class="text-[7px] font-extrabold tracking-[0.1em] text-amber-300 uppercase">SEP • SEMS • DGETI</p>
                    <h1 class="text-[12px] font-black tracking-wide uppercase mt-0.5 text-white drop-shadow">CETis No. 116</h1>
                    <p class="text-[7.5px] text-rose-100 font-semibold italic">"Antonia Nava de Catalán"</p>
                </div>

                <!-- Logo CETis 116 -->
                <div class="w-11 h-11 bg-white/95 rounded-lg p-1 flex items-center justify-center flex-shrink-0 shadow border border-amber-400/50">
                    <img src="logotipocetis116.png" alt="CETis 116" class="w-full h-full object-contain">
                </div>
            </div>

            <!-- CUERPO CENTRAL CON FOTO CENTRADA Y DATOS REACOMODADOS -->
            <div class="px-3.5 py-1.5 flex flex-col justify-between flex-grow">
                
                <!-- Nombre del Alumno -->
                <div class="text-center mt-0.5">
                    <span class="inline-block text-[7px] font-bold bg-amber-500/20 text-amber-900 border border-amber-500/40 px-2.5 py-0.2 rounded-full uppercase tracking-wider mb-0.5">
                        Estudiante Acreditado
                    </span>
                    <p id="cardNombre" class="text-[12px] font-black text-slate-900 leading-tight uppercase tracking-tight">
                        CARGANDO...
                    </p>
                </div>

                <!-- Especialidad Técnica -->
                <div class="bg-slate-900 text-amber-300 text-center py-1 rounded-md shadow-inner my-1">
                    <p class="text-[6.5px] uppercase tracking-widest text-slate-400 font-semibold">Especialidad:</p>
                    <p id="cardEspecialidad" class="text-[10px] font-black uppercase tracking-wide text-amber-300">
                        Cargando...
                    </p>
                </div>

                <!-- Datos Secundarios -->
                <div class="grid grid-cols-2 gap-x-2 gap-y-1 bg-slate-100 p-2 rounded-lg border border-slate-200 text-[8.5px]">
                    <div>
                        <span class="text-slate-500 font-bold block text-[6.5px]">NO. CONTROL:</span>
                        <span id="cardMatricula" class="font-mono font-bold text-slate-900">-</span>
                    </div>
                    <div>
                        <span class="text-slate-500 font-bold block text-[6.5px]">SEMESTRE / GRUPO:</span>
                        <span id="cardSemestreGrupo" class="font-mono font-bold text-slate-900">-</span>
                    </div>
                    <div class="col-span-2">
                        <span class="text-slate-500 font-bold block text-[6.5px]">CURP:</span>
                        <span id="cardCurp" class="font-mono font-bold text-slate-900 truncate block">-</span>
                    </div>
                    <div>
                        <span class="text-slate-500 font-bold block text-[6.5px]">TURNO:</span>
                        <span class="font-bold text-slate-900 uppercase">MATUTINO</span>
                    </div>
                    <div>
                        <span class="text-slate-500 font-bold block text-[6.5px]">SANGRE:</span>
                        <span id="cardSangre" class="font-bold text-rose-700 uppercase">-</span>
                    </div>
                </div>

                <!-- FOTOGRAFÍA OFICIAL PERFECTAMENTE CENTRADA -->
                <div class="flex justify-center items-center my-1">
                    <div class="w-[90px] h-[115px] bg-slate-200 border-2 border-[#c59b4d] rounded-lg overflow-hidden shadow-md relative">
                        <img id="cardFoto" src="" alt="Foto Alumno" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>

            <!-- PIE DE CREDENCIAL INFERIOR (SUBIDO Y AJUSTADO) -->
            <div class="bg-slate-900 text-slate-200 px-3 py-1 flex justify-between items-center text-[7.5px] border-t border-[#c59b4d]">
                <span>VIGENCIA: <strong class="text-amber-400">2026 - 2027</strong></span>
                <span class="font-mono text-slate-300">C.C.T. 12DCT0007F</span>
            </div>
        </div>
    </div>

    <!-- Botón de Impresión -->
    <div class="mt-6 flex gap-3 no-print">
        <button onclick="window.print()" class="btn-gold font-extrabold px-6 py-3 rounded-xl shadow-xl transition duration-200 text-xs uppercase tracking-wider flex items-center gap-2">
            <span>🖨️</span> Imprimir Anverso Vertical (ZC300)
        </button>
    </div>

    <!-- Script de Conexión Firestore -->
    <script type="module">
        import { db, doc, getDoc } from "./firebase-config.js";

        async function cargarCredencialVertical() {
            const params = new URLSearchParams(window.location.search);
            const alumnoId = params.get('id');

            if (!alumnoId) {
                alert("No se especificó un estudiante.");
                return;
            }

            document.getElementById('linkReverso').href = `reverso.html?id=${alumnoId}`;

            try {
                const docRef = doc(db, "estudiantes_credenciales", alumnoId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('cardNombre').innerText = data.nombreCompleto || '';
                    document.getElementById('cardEspecialidad').innerText = data.especialidad || '';
                    document.getElementById('cardSemestreGrupo').innerText = `${data.semestre || '1'}° "${data.grupo || 'A'}"`;
                    document.getElementById('cardMatricula').innerText = data.matricula || '';
                    document.getElementById('cardCurp').innerText = data.curp || '';
                    document.getElementById('cardSangre').innerText = data.tipoSangre || 'O+';

                    if (data.fotoBase64) {
                        document.getElementById('cardFoto').src = data.fotoBase64;
                    }
                } else {
                    alert("Estudiante no encontrado en Firebase.");
                }
            } catch (error) {
                console.error("Error al cargar credencial:", error);
            }
        }

        cargarCredencialVertical();
    </script>
</body>
</html>
