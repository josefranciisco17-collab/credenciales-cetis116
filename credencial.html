<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial Estudiantil - CETis 116</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cr80-card {
            width: 428px;
            height: 270px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        @media print {
            body { background: none; }
            .no-print { display: none; }
            .cr80-card { box-shadow: none; margin: 0; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Contenedor de la Credencial (Anverso con QR integrado) -->
    <div class="mb-6">
        <h2 class="text-xs uppercase tracking-widest text-sky-400 mb-2 font-semibold text-center">Credencial Oficial - CETis 116</h2>
        <div class="cr80-card rounded-xl p-4 shadow-2xl border border-slate-700 relative overflow-hidden flex flex-col justify-between">
            
            <!-- Encabezado Institucional -->
            <div class="flex items-center justify-between border-b border-slate-700 pb-2">
                <div>
                    <h1 class="text-xs font-bold text-white tracking-wider">CETis No. 116</h1>
                    <p class="text-[9px] text-slate-400">Antonia Nava de Catalán</p>
                </div>
                <span class="text-[9px] bg-sky-600 text-white px-2 py-0.5 rounded-full font-medium">SEMS SEP</span>
            </div>

            <!-- Cuerpo Central: Foto, Datos y Código QR -->
            <div class="flex items-center justify-between my-auto gap-2">
                <div class="flex items-center gap-3">
                    <!-- Foto del Alumno -->
                    <div class="w-20 h-24 bg-slate-800 border-2 border-sky-500 rounded-md overflow-hidden flex-shrink-0 shadow-md">
                        <img id="cardFoto" src="" alt="Foto Alumno" class="w-full h-full object-cover">
                    </div>
                    <!-- Datos Dinámicos del Alumno -->
                    <div class="flex flex-col justify-center text-xs space-y-1 overflow-hidden max-w-[170px]">
                        <div>
                            <p class="text-[9px] text-slate-400 uppercase">Nombre:</p>
                            <p id="cardNombre" class="font-bold text-white truncate text-[11px]">Cargando...</p>
                        </div>
                        <div>
                            <p class="text-[9px] text-slate-400 uppercase">Especialidad:</p>
                            <p id="cardEspecialidad" class="text-sky-300 truncate text-[10px]">Cargando...</p>
                        </div>
                        <div class="flex gap-2">
                            <div>
                                <p class="text-[9px] text-slate-400 uppercase">Matrícula:</p>
                                <p id="cardMatricula" class="font-mono text-slate-200 text-[10px]">-</p>
                            </div>
                            <div>
                                <p class="text-[9px] text-slate-400 uppercase">Grupo:</p>
                                <p id="cardGrupo" class="font-mono text-slate-200 text-[10px]">-</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Código QR Dinámico -->
                <div class="bg-white p-1 rounded-md shadow-md flex-shrink-0 flex flex-col items-center justify-center">
                    <img id="cardQR" src="" alt="QR Alumno" class="w-16 h-16 object-contain">
                    <span class="text-[7px] text-slate-900 font-bold mt-0.5 tracking-tighter">VALIDAR</span>
                </div>
            </div>

            <!-- Pie de Credencial / Vigencia -->
            <div class="border-t border-slate-700 pt-1.5 flex justify-between items-center text-[9px] text-slate-400">
                <span>Vigencia: <strong class="text-white">2026 - 2027</strong></span>
                <span class="italic text-sky-400">Acapulco, Gro.</span>
            </div>
        </div>
    </div>

    <!-- Botón de Impresión -->
    <button onclick="window.print()" class="no-print bg-sky-600 hover:bg-sky-500 text-white font-semibold px-6 py-2.5 rounded-lg shadow-lg transition duration-200 text-sm">
        Imprimir Credencial (Zebra ZC300)
    </button>

    <!-- Script para conectar con Firestore y generar QR -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        async function cargarDatosCredencial() {
            const params = new URLSearchParams(window.location.search);
            const alumnoId = params.get('id');

            if (!alumnoId) {
                alert("No se especificó un alumno para generar la credencial.");
                return;
            }

            try {
                const docRef = doc(db, "estudiantes_credenciales", alumnoId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('cardNombre').innerText = data.nombreCompleto || '';
                    document.getElementById('cardEspecialidad').innerText = data.especialidad || '';
                    document.getElementById('cardMatricula').innerText = data.matricula || '';
                    document.getElementById('cardGrupo').innerText = `${data.semestre || ''} ${data.grupo || ''}`;
                    
                    if (data.fotoBase64) {
                        document.getElementById('cardFoto').src = data.fotoBase64;
                    }

                    // Generar Código QR con la información clave del alumno
                    const textoQR = `CETis 116\nMatrícula: ${data.matricula}\nNombre: ${data.nombreCompleto}\nCURP: ${data.curp}\nSangre: ${data.tipoSangre}`;
                    const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(textoQR)}&size=150&margin=1`;
                    document.getElementById('cardQR').src = qrUrl;

                } else {
                    alert("No se encontró el registro del alumno en la base de datos.");
                }
            } catch (error) {
                console.error("Error al cargar los datos:", error);
            }
        }

        cargarDatosCredencial();
    </script>
</body>
</html>
