<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial Oficial - CETis No. 116</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #070b14;
            color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* TAMAÑO REAL CR-80 VERTICAL (54mm x 85.6mm) */
        .cr80-vertical {
            width: 54mm;
            height: 85.6mm;
            background: #ffffff;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 3mm;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .btn-gold {
            background: linear-gradient(135deg, #d4b26f 0%, #c59b4d 100%);
            color: #1a1205;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #e0c283 0%, #d1a95b 100%);
        }

        /* REGLAS ESTRICTAS DE IMPRESIÓN PARA LA ZEBRA ZC300 */
        @media print {
            @page {
                size: 54mm 85.6mm;
                margin: 0 !important;
            }
            html, body {
                width: 54mm !important;
                height: 85.6mm !important;
                background: none !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
            }
            body * {
                display: none !important;
            }
            #areaImpresion, #areaImpresion * {
                display: flex !important;
                visibility: visible !important;
            }
            #areaImpresion {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 54mm !important;
                height: 85.6mm !important;
                margin: 0 !important;
                padding: 0 !important;
                z-index: 99999;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación (Oculta al imprimir) -->
    <div class="no-print w-[54mm] flex justify-between items-center mb-3">
        <a href="index.html" class="text-[11px] bg-slate-900 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-lg font-semibold shadow">
            ⬅ Padrón
        </a>
        <a id="linkReverso" href="reverso.html" class="text-[11px] bg-slate-900 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-lg font-semibold shadow">
            Ver Reverso ➡
        </a>
    </div>

    <!-- CONTENEDOR DE IMPRESIÓN -->
    <div id="areaImpresion">
        <div class="cr80-vertical select-none">
            
            <!-- ENCABEZADO GUINDA INSTITUCIONAL -->
            <div style="background-color: #4a0e1e; border-bottom: 1.5mm solid #c59b4d;" class="text-white px-2 py-1.5 flex items-center justify-between">
                <div class="w-7 h-7 bg-white rounded p-0.5 flex items-center justify-center flex-shrink-0 shadow">
                    <img src="logotipodgti.png" alt="DGETI" class="w-full h-full object-contain">
                </div>
                <div class="text-center flex-grow leading-none px-0.5">
                    <p style="font-size: 5px;" class="font-extrabold text-amber-300 uppercase tracking-tighter">SEP • SEMS • DGETI</p>
                    <h1 style="font-size: 8.5px;" class="font-black uppercase text-white mt-0.5">CETis No. 116</h1>
                    <p style="font-size: 5.5px;" class="text-rose-100 italic">"Antonia Nava de Catalán"</p>
                </div>
                <div class="w-7 h-7 bg-white rounded p-0.5 flex items-center justify-center flex-shrink-0 shadow">
                    <img src="logotipocetis116.png" alt="CETis 116" class="w-full h-full object-contain">
                </div>
            </div>

            <!-- CUERPO DE DATOS Y FOTOGRAFÍA -->
            <div class="px-2 py-1 flex flex-col justify-between flex-grow">
                
                <!-- Nombre del Alumno -->
                <div class="text-center">
                    <span style="font-size: 5px;" class="inline-block font-bold bg-amber-500/20 text-amber-900 px-2 py-0.2 rounded-full uppercase">
                        Estudiante Acreditado
                    </span>
                    <p id="cardNombre" style="font-size: 8.5px;" class="font-black text-slate-900 uppercase leading-tight mt-0.5">
                        CARGANDO...
                    </p>
                </div>

                <!-- Especialidad Técnica -->
                <div style="background-color: #0f172a;" class="text-amber-300 text-center py-0.5 rounded shadow-inner">
                    <p style="font-size: 5px;" class="text-slate-400 font-semibold uppercase">Especialidad:</p>
                    <p id="cardEspecialidad" style="font-size: 7.5px;" class="font-black uppercase tracking-tight text-amber-300">
                        Cargando...
                    </p>
                </div>

                <!-- Datos Secundarios en Rejilla Compacta -->
                <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded border border-slate-200" style="font-size: 6.5px;">
                    <div>
                        <span class="text-slate-500 font-bold block" style="font-size: 5px;">NO. CONTROL:</span>
                        <span id="cardMatricula" class="font-mono font-bold text-slate-900">-</span>
                    </div>
                    <div>
                        <span class="text-slate-500 font-bold block" style="font-size: 5px;">SEMESTRE / GRUPO:</span>
                        <span id="cardSemestreGrupo" class="font-mono font-bold text-slate-900">-</span>
                    </div>
                    <div class="col-span-2">
                        <span class="text-slate-500 font-bold block" style="font-size: 5px;">CURP:</span>
                        <span id="cardCurp" class="font-mono font-bold text-slate-900 truncate block">-</span>
                    </div>
                    <div>
                        <span class="text-slate-500 font-bold block" style="font-size: 5px;">TURNO:</span>
                        <span class="font-bold text-slate-900 uppercase">MATUTINO</span>
                    </div>
                    <div>
                        <span class="text-slate-500 font-bold block" style="font-size: 5px;">SANGRE:</span>
                        <span id="cardSangre" class="font-bold text-rose-700 uppercase">-</span>
                    </div>
                </div>

                <!-- FOTOGRAFÍA OFICIAL CENTRADA -->
                <div class="flex justify-center items-center my-0.5">
                    <div style="width: 21mm; height: 26.5mm;" class="bg-slate-200 border border-[#c59b4d] rounded overflow-hidden shadow relative">
                        <img id="cardFoto" src="" alt="Foto Alumno" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>

            <!-- PIE DE CREDENCIAL -->
            <div style="background-color: #0f172a; border-top: 1px solid #c59b4d; font-size: 6px;" class="text-slate-200 px-2 py-1 flex justify-between items-center">
                <span>VIGENCIA: <strong class="text-amber-400">2026 - 2027</strong></span>
                <span class="font-mono text-slate-300">C.C.T. 12DCT0007F</span>
            </div>
        </div>
    </div>

    <!-- Botón de Impresión -->
    <div class="mt-4 no-print">
        <button onclick="window.print()" class="btn-gold font-extrabold px-6 py-2.5 rounded-xl shadow-xl transition text-xs uppercase tracking-wider flex items-center gap-2">
            <span>🖨️</span> Imprimir Anverso Vertical (ZC300)
        </button>
    </div>

    <!-- Script de Conexión Firestore -->
    <script type="module">
        import { db, doc, getDoc } from "./firebase-config.js";

        async function cargarCredencialVertical() {
            const params = new URLSearchParams(window.location.search);
            const alumnoId = params.get('id');

            if (!alumnoId) {
                alert("No se especificó un estudiante.");
                return;
            }

            document.getElementById('linkReverso').href = `reverso.html?id=${alumnoId}`;

            try {
                const docRef = doc(db, "estudiantes_credenciales", alumnoId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('cardNombre').innerText = data.nombreCompleto || '';
                    document.getElementById('cardEspecialidad').innerText = data.especialidad || '';
                    document.getElementById('cardSemestreGrupo').innerText = `${data.semestre || '1'}° "${data.grupo || 'A'}"`;
                    document.getElementById('cardMatricula').innerText = data.matricula || '';
                    document.getElementById('cardCurp').innerText = data.curp || '';
                    document.getElementById('cardSangre').innerText = data.tipoSangre || 'O+';

                    if (data.fotoBase64) {
                        document.getElementById('cardFoto').src = data.fotoBase64;
                    }
                } else {
                    alert("Estudiante no encontrado en Firebase.");
                }
            } catch (error) {
                console.error("Error al cargar credencial:", error);
            }
        }

        cargarCredencialVertical();
    </script>
</body>
</html>
