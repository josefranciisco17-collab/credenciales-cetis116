<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anverso de Credencial - CETis No. 116</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #070b14;
            font-family: Arial, Helvetica, sans-serif;
        }
        /* Proporción estándar CR-80 Vertical (54mm x 85.6mm -> escala web 340px x 540px) */
        .cr80-card {
            width: 340px;
            height: 540px;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .btn-gold {
            background: linear-gradient(135deg, #d4b26f 0%, #c59b4d 100%);
            color: #1a1205;
        }
        @media print {
            body {
                background: none;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .cr80-card {
                width: 54mm;
                height: 85.6mm;
                box-shadow: none;
                border-radius: 0;
                margin: 0;
            }
        }
    </style>
    <script>
        if (!localStorage.getItem("cetis116_user_email")) {
            window.location.replace("login.html");
        }
    </script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- BARRA SUPERIOR DE CONTROLES (NO SE IMPRIME) -->
    <div class="no-print w-full max-w-md bg-[#4a0e1e] text-white border-b-4 border-[#c59b4d] rounded-2xl p-3.5 mb-5 flex items-center justify-between shadow-xl">
        <a href="index.html" class="bg-slate-900 text-amber-300 border border-amber-500/40 px-3.5 py-2 rounded-xl text-xs font-extrabold uppercase hover:bg-slate-800 transition">
            ⬅ Padrón
        </a>
        <span class="text-xs font-black uppercase tracking-wider text-amber-300">Vista Anverso</span>
        <a id="btnIrReverso" href="reverso.html" class="btn-gold px-3.5 py-2 rounded-xl text-xs font-black uppercase transition shadow">
            🔄 Reverso
        </a>
    </div>

    <!-- CONTENEDOR DE LA CREDENCIAL (CR-80) -->
    <div id="credencialAnverso" class="cr80-card border border-slate-300">
        
        <!-- ENCABEZADO GUINDA INSTITUCIONAL -->
        <div class="bg-[#4a0e1e] text-white pt-3 pb-2.5 px-3 border-b-4 border-[#c59b4d] flex items-center justify-between gap-2 relative">
            <div class="w-11 h-11 bg-white rounded-lg p-1 flex items-center justify-center shadow flex-shrink-0">
                <img src="logo-dgti.png" alt="DGETI" class="w-full h-full object-contain" crossorigin="anonymous">
            </div>
            <div class="text-center flex-grow">
                <p class="text-[8px] font-black tracking-widest text-amber-300 uppercase leading-tight">SEP • SEMS • DGETI</p>
                <h1 class="text-[12px] font-black tracking-wider uppercase text-white leading-tight mt-0.5">CETis No. 116</h1>
                <p class="text-[7.5px] text-amber-100 font-bold leading-tight">"Antonia Nava de Catalán"</p>
                <p class="text-[7px] text-amber-300/90 font-mono leading-tight">C.C.T. 12DCT0007F</p>
            </div>
            <div class="w-11 h-11 bg-white rounded-lg p-1 flex items-center justify-center shadow flex-shrink-0">
                <img src="logo116.png" alt="CETis 116" class="w-full h-full object-contain" crossorigin="anonymous">
            </div>
        </div>

        <!-- CUERPO CENTRAL DE LA CREDENCIAL -->
        <div class="flex-grow flex flex-col items-center justify-center px-4 py-2 bg-gradient-to-b from-slate-50 to-white relative">
            
            <!-- ETIQUETA ESTUDIANTE -->
            <div class="bg-[#4a0e1e] text-amber-300 text-[9px] font-black uppercase tracking-widest px-4 py-0.5 rounded-full border border-[#c59b4d] mb-2 shadow-sm">
                Credencial de Estudiante
            </div>

            <!-- FOTOGRAFÍA DEL ALUMNO -->
            <div class="w-28 h-36 bg-slate-200 rounded-xl border-2 border-[#4a0e1e] shadow-md overflow-hidden mb-2.5 flex items-center justify-center">
                <img id="fotoAlumno" src="" alt="Fotografía" class="w-full h-full object-cover">
            </div>

            <!-- NOMBRE COMPLETO -->
            <div class="w-full text-center px-1 mb-2">
                <p class="text-[8px] font-bold text-slate-400 uppercase tracking-widest">Nombre del Alumno(a)</p>
                <h2 id="nombreAlumno" class="text-[13px] font-black text-slate-900 uppercase leading-snug break-words mt-0.5">
                    Cargando...
                </h2>
            </div>

            <!-- FRANJA DE ESPECIALIDAD CON COLOR DINÁMICO -->
            <div id="franjaEspecialidad" class="w-full bg-[#4a0e1e] text-white py-1.5 px-2 rounded-lg text-center shadow-sm mb-2 border border-amber-400/50">
                <p class="text-[7px] uppercase tracking-widest text-amber-200 font-bold">Especialidad Técnica</p>
                <p id="especialidadAlumno" class="text-[10px] font-black uppercase tracking-wider truncate">---</p>
            </div>

            <!-- DATOS ACADÉMICOS Y MÉDICOS -->
            <div class="w-full grid grid-cols-3 gap-1.5 text-center bg-slate-100 p-2 rounded-xl border border-slate-200">
                <div>
                    <p class="text-[7px] font-extrabold text-slate-500 uppercase">No. Control</p>
                    <p id="matriculaAlumno" class="text-[10px] font-black text-slate-900 font-mono mt-0.5">---</p>
                </div>
                <div class="border-x border-slate-300">
                    <p class="text-[7px] font-extrabold text-slate-500 uppercase">Sem / Grupo</p>
                    <p id="semGrupoAlumno" class="text-[10px] font-black text-slate-900 font-mono mt-0.5">---</p>
                </div>
                <div>
                    <p class="text-[7px] font-extrabold text-slate-500 uppercase">Turno / Sangre</p>
                    <p id="turnoSangreAlumno" class="text-[9px] font-black text-rose-800 uppercase mt-0.5">---</p>
                </div>
            </div>
        </div>

        <!-- PIE DE CREDENCIAL -->
        <div class="bg-slate-900 text-white py-2 px-3 border-t-2 border-[#c59b4d] flex items-center justify-between text-[8px]">
            <span class="font-bold text-amber-300 uppercase tracking-wider">Acapulco, Gro.</span>
            <span id="curpAlumno" class="font-mono text-slate-300">CURP: ---</span>
        </div>
    </div>

    <!-- BOTONES DE IMPRESIÓN Y DESCARGA -->
    <div class="no-print w-full max-w-md flex gap-3 mt-5">
        <button onclick="descargarPNG()" class="flex-1 btn-gold font-black py-3 rounded-xl uppercase text-xs tracking-wider shadow-lg cursor-pointer flex items-center justify-center gap-2">
            <span>📥</span> Guardar Imagen
        </button>
        <button onclick="window.print()" class="flex-1 bg-slate-800 text-amber-300 border border-amber-500/40 font-black py-3 rounded-xl uppercase text-xs tracking-wider shadow-lg hover:bg-slate-700 cursor-pointer flex items-center justify-center gap-2">
            <span>🖨️</span> Imprimir PVC
        </button>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const params = new URLSearchParams(window.location.search);
        const alumnoId = params.get("id");

        if (alumnoId) {
            document.getElementById("btnIrReverso").href = `reverso.html?id=${alumnoId}`;
        }

        async function cargarCredencial() {
            if (!alumnoId) {
                alert("No se especificó ningún estudiante.");
                window.location.replace("index.html");
                return;
            }

            try {
                const docSnap = await getDoc(doc(db, "estudiantes_credenciales", alumnoId));
                if (!docSnap.exists()) {
                    alert("El registro del estudiante no existe.");
                    window.location.replace("index.html");
                    return;
                }

                const d = docSnap.data();
                document.getElementById("fotoAlumno").src = d.fotoBase64 || "logo116.png";
                document.getElementById("nombreAlumno").innerText = d.nombreCompleto || "SIN NOMBRE";
                document.getElementById("especialidadAlumno").innerText = d.especialidad || "GENERAL";
                document.getElementById("matriculaAlumno").innerText = d.matricula || "-";
                document.getElementById("semGrupoAlumno").innerText = `${d.semestre || '1'}° "${d.grupo || 'A'}"`;
                document.getElementById("turnoSangreAlumno").innerText = `${(d.turno || 'MAT').substring(0,3)} • ${d.tipoSangre || 'O+'}`;
                document.getElementById("curpAlumno").innerText = d.curp ? `CURP: ${d.curp}` : "VIGENCIA 2026-2027";

                // Color de franja según especialidad si aplica
                const esp = (d.especialidad || "").toUpperCase();
                const franja = document.getElementById("franjaEspecialidad");
                if (esp.includes("PROGRAMACIÓN") || esp.includes("PROGRAMACION")) {
                    franja.className = "w-full bg-blue-900 text-white py-1.5 px-2 rounded-lg text-center shadow-sm mb-2 border border-blue-400";
                } else if (esp.includes("LABORATORISTA")) {
                    franja.className = "w-full bg-emerald-900 text-white py-1.5 px-2 rounded-lg text-center shadow-sm mb-2 border border-emerald-400";
                } else if (esp.includes("CONTABILIDAD")) {
                    franja.className = "w-full bg-amber-800 text-white py-1.5 px-2 rounded-lg text-center shadow-sm mb-2 border border-amber-400";
                }
            } catch (error) {
                console.error("Error al cargar credencial:", error);
            }
        }

        window.descargarPNG = async function() {
            const card = document.getElementById("credencialAnverso");
            const canvas = await html2canvas(card, { scale: 3, useCORS: true });
            const link = document.createElement("a");
            link.download = `Anverso_${document.getElementById("matriculaAlumno").innerText}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        };

        cargarCredencial();
    </script>
</body>
</html>
