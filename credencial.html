<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial Oficial - CETis No. 116</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #070b14;
            color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        /* Proporción exacta CR-80 Vertical para tarjeta PVC (54mm x 85.6mm) */
        .cr80-card-vertical {
            width: 270px;
            height: 428px;
            background: #ffffff;
            position: relative;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        .btn-gold {
            background: linear-gradient(135deg, #d4b26f 0%, #c59b4d 100%);
            color: #1a1205;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #e0c283 0%, #d1a95b 100%);
        }
        
        /* REGLAS ESTRICTAS PARA IMPRESIÓN VERTICAL EN ZEBRA ZC300 */
        @media print {
            @page {
                size: 54mm 85.6mm;
                margin: 0;
            }
            body, html {
                width: 54mm !important;
                height: 85.6mm !important;
                background: none !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
            }
            body * {
                visibility: hidden !important;
            }
            .cr80-card-vertical, .cr80-card-vertical * {
                visibility: visible !important;
            }
            .no-print {
                display: none !important;
            }
            .cr80-card-vertical {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 54mm !important;
                height: 85.6mm !important;
                margin: 0 !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Barra Superior de Navegación (Oculta al imprimir) -->
    <div class="no-print w-full max-w-[270px] flex justify-between items-center mb-4">
        <a href="index.html" class="text-xs bg-slate-900 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-xl transition font-semibold shadow">
            ⬅ Padrón
        </a>
        <a id="linkReverso" href="reverso.html" class="text-xs bg-slate-900 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-xl transition font-semibold shadow">
            Ver Reverso ➡
        </a>
    </div>

    <!-- TARJETA CR-80 VERTICAL (ANVERSO OFICIAL) -->
    <div class="cr80-card-vertical rounded-xl shadow-2xl border border-slate-300 overflow-hidden flex select-none">
        
        <!-- Franja Lateral Izquierda (Especialidad Vertical) -->
        <div class="w-9 bg-[#1a050c] text-white flex flex-col items-center justify-between py-3 px-0.5 border-r border-amber-500/40 flex-shrink-0">
            <span class="text-[8px] font-black tracking-widest text-amber-400 uppercase">CETis 116</span>
            <span id="cardEspecialidadVertical" class="text-[9.5px] font-black tracking-wider uppercase [writing-mode:vertical-rl] rotate-180 text-center py-2 text-slate-100">
                LABORATORISTA CLINICO
            </span>
            <span class="text-[7px] text-slate-400">DGETI</span>
        </div>

        <!-- Contenido Principal Derecho -->
        <div class="flex-grow flex flex-col justify-between p-2.5 overflow-hidden">
            
            <!-- Encabezado Institucional -->
            <div class="border-b border-slate-300 pb-1.5 flex items-start justify-between gap-1">
                <div class="leading-tight">
                    <p class="text-[6.5px] font-bold text-slate-700 tracking-tighter uppercase">CENTRO DE ESTUDIOS TECNOLÓGICOS</p>
                    <p class="text-[6px] text-slate-600">INDUSTRIAL Y DE SERVICIOS NO. 116</p>
                    <p class="text-[6px] font-mono font-bold text-slate-800">CCT 12DCT0007F ANTONIA NAVA DE CATALÁN</p>
                </div>
                <div class="w-8 h-8 flex-shrink-0">
                    <img src="logotipodgti.png" alt="Logo DGETI" class="w-full h-full object-contain">
                </div>
            </div>

            <!-- Datos Centrales del Estudiante -->
            <div class="space-y-1 my-auto">
                <div>
                    <p class="text-[6.5px] text-slate-500 font-bold uppercase">ALUMNO(A):</p>
                    <p id="cardNombre" class="text-[10.5px] font-black text-slate-900 leading-tight uppercase truncate border-b border-slate-900 pb-0.5">
                        CARGANDO...
                    </p>
                </div>

                <div class="flex justify-between items-center pt-0.5">
                    <div>
                        <p class="text-[6px] text-slate-500 font-bold uppercase">SEMESTRE / GRUPO:</p>
                        <p id="cardSemestreGrupo" class="text-[10px] font-bold text-slate-900 font-mono">-</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[6px] text-slate-500 font-bold uppercase">TURNO:</p>
                        <p class="text-[9px] font-bold text-slate-900 uppercase">MATUTINO</p>
                    </div>
                </div>

                <div>
                    <p class="text-[6px] text-slate-500 font-bold uppercase">MATRÍCULAS / CONTROL:</p>
                    <p id="cardMatricula" class="text-[9px] font-bold text-slate-900 font-mono">-</p>
                </div>

                <div>
                    <p class="text-[6px] text-slate-500 font-bold uppercase">CURP:</p>
                    <p id="cardCurp" class="text-[8.5px] font-bold text-slate-900 font-mono truncate">-</p>
                </div>
            </div>

            <!-- Fotografía del Estudiante en la parte inferior -->
            <div class="flex justify-center items-center mt-1">
                <div class="w-[95px] h-[115px] bg-slate-200 border-2 border-slate-800 rounded overflow-hidden shadow relative">
                    <img id="cardFoto" src="" alt="Foto Alumno" class="w-full h-full object-cover">
                </div>
            </div>
            
            <!-- Pie inferior decorativo DGETI / SEP -->
            <div class="pt-1 flex justify-between items-center text-[5.5px] text-slate-500 font-bold border-t border-slate-200">
                <span>SEMS • SEP</span>
                <span class="text-slate-400">ACAPULCO, GRO.</span>
            </div>
        </div>
    </div>

    <!-- Botones de Acción (Ocultos al imprimir) -->
    <div class="mt-6 flex gap-3 no-print">
        <button onclick="window.print()" class="btn-gold font-extrabold px-6 py-3 rounded-xl shadow-xl transition duration-200 text-xs uppercase tracking-wider flex items-center gap-2">
            <span>🖨️</span> Imprimir Anverso Vertical (ZC300)
        </button>
    </div>

    <!-- Script de Conexión Firestore -->
    <script type="module">
        import { db, doc, getDoc } from "./firebase-config.js";

        async function cargarCredencialVertical() {
            const params = new URLSearchParams(window.location.search);
            const alumnoId = params.get('id');

            if (!alumnoId) {
                alert("No se especificó un estudiante.");
                return;
            }

            // Actualizar enlace al reverso manteniendo el ID
            document.getElementById('linkReverso').href = `reverso.html?id=${alumnoId}`;

            try {
                const docRef = doc(db, "estudiantes_credenciales", alumnoId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('cardNombre').innerText = data.nombreCompleto || '';
                    document.getElementById('cardEspecialidadVertical').innerText = data.especialidad || 'LABORATORISTA CLINICO';
                    document.getElementById('cardSemestreGrupo').innerText = `${data.semestre || '1'}° "${data.grupo || 'A'}"`;
                    document.getElementById('cardMatricula').innerText = data.matricula || '';
                    document.getElementById('cardCurp').innerText = data.curp || '';

                    if (data.fotoBase64) {
                        document.getElementById('cardFoto').src = data.fotoBase64;
                    }
                } else {
                    alert("Estudiante no encontrado en Firebase.");
                }
            } catch (error) {
                console.error("Error al cargar credencial:", error);
            }
        }

        cargarCredencialVertical();
    </script>
</body>
</html>
