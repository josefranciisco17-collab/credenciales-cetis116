<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Credenciales - CETis 116</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <!-- Encabezado del Sistema -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-sky-400">CETis No. 116</h1>
                <p class="text-sm text-slate-400">Sistema de Emisión de Credenciales Escolares (Zebra ZC300)</p>
            </div>
            <div class="flex gap-3">
                <a href="registro.html" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold px-4 py-2 rounded-lg text-sm transition duration-200 shadow-md">
                    + Registrar Nuevo Alumno
                </a>
            </div>
        </div>

        <!-- Buscador y Listado -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <div class="mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <h2 class="text-lg font-semibold text-white">Alumnos Registrados</h2>
                <input type="text" id="buscador" placeholder="Buscar por matrícula o nombre..." class="w-full md:w-80 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:border-sky-500 outline-none">
            </div>

            <!-- Tabla de Registros -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs text-slate-400 uppercase">
                            <th class="py-3 px-4">Matrícula</th>
                            <th class="py-3 px-4">Alumno</th>
                            <th class="py-3 px-4">Especialidad</th>
                            <th class="py-3 px-4">Grupo</th>
                            <th class="py-3 px-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaAlumnos" class="divide-y divide-slate-800 text-sm">
                        <tr>
                            <td colspan="5" class="py-6 text-center text-slate-500">Cargando registros desde Firebase...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script para consultar Firestore y listar alumnos -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let listaAlumnos = [];

        async function cargarAlumnos() {
            const tbody = document.getElementById('tablaAlumnos');
            try {
                const querySnapshot = await getDocs(collection(db, "estudiantes_credenciales"));
                listaAlumnos = [];
                querySnapshot.forEach((docSnap) => {
                    listaAlumnos.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderizarTabla(listaAlumnos);
            } catch (error) {
                console.error("Error al cargar alumnos:", error);
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-red-400">Error al conectar con la base de datos.</td></tr>`;
            }
        }

        function renderizarTabla(alumnos) {
            const tbody = document.getElementById('tablaAlumnos');
            if (alumnos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-500">No hay alumnos registrados.</td></tr>`;
                return;
            }

            tbody.innerHTML = alumnos.map(alumno => `
                <tr class="hover:bg-slate-800/50 transition duration-150">
                    <td class="py-3 px-4 font-mono text-sky-400">${alumno.matricula || ''}</td>
                    <td class="py-3 px-4 font-semibold text-white">${alumno.nombreCompleto || ''}</td>
                    <td class="py-3 px-4 text-slate-300 text-xs">${alumno.especialidad || ''}</td>
                    <td class="py-3 px-4 text-slate-300">${alumno.semestre || ''} ${alumno.grupo || ''}</td>
                    <td class="py-3 px-4 text-center flex justify-center gap-2">
                        <a href="credencial.html?id=${alumno.id}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">
                            Ver Credencial
                        </a>
                        <button onclick="eliminarAlumno('${alumno.id}')" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white px-2.5 py-1.5 rounded-lg text-xs font-medium transition">
                            Eliminar
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Función global para eliminar registro
        window.eliminarAlumno = async function(id) {
            if (confirm("¿Estás seguro de eliminar este registro del sistema?")) {
                try {
                    await deleteDoc(doc(db, "estudiantes_credenciales", id));
                    alert("Registro eliminado correctamente.");
                    cargarAlumnos();
                } catch (error) {
                    console.error("Error al eliminar:", error);
                    alert("Hubo un error al intentar eliminar el registro.");
                }
            }
        }

        // Filtro de búsqueda en tiempo real
        document.getElementById('buscador').addEventListener('input', function(e) {
            const texto = e.target.value.toLowerCase();
            const filtrados = listaAlumnos.filter(a => 
                (a.nombreCompleto && a.nombreCompleto.toLowerCase().includes(texto)) ||
                (a.matricula && a.matricula.toLowerCase().includes(texto))
            );
            renderizarTabla(filtrados);
        });

        cargarAlumnos();
    </script>
</body>
</html>
