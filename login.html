<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - Credenciales CETis No. 116</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #070b14;
            color: #0f172a;
            font-family: Arial, Helvetica, sans-serif;
        }
        .btn-gold {
            background: linear-gradient(135deg, #d4b26f 0%, #c59b4d 100%);
            color: #1a1205;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #e0c283 0%, #d1a95b 100%);
        }
        .app-card-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }
    </style>
    <script>
        // Si ya tiene sesión activa, salta directo al padrón
        if (localStorage.getItem("cetis116_user_email")) {
            window.location.replace("index.html");
        }
    </script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl app-card-shadow overflow-hidden border border-amber-500/30">
        
        <!-- ENCABEZADO INSTITUCIONAL -->
        <div class="bg-[#4a0e1e] text-white p-6 border-b-4 border-[#c59b4d] text-center">
            <div class="flex justify-center items-center gap-3 mb-3">
                <div class="w-12 h-12 bg-white rounded-xl p-1 flex items-center justify-center shadow border border-amber-400">
                    <img src="logo-dgti.png" alt="DGETI" class="w-full h-full object-contain">
                </div>
                <div class="w-12 h-12 bg-white rounded-xl p-1 flex items-center justify-center shadow border border-amber-400">
                    <img src="logo116.png" alt="CETis 116" class="w-full h-full object-contain">
                </div>
            </div>
            <p class="text-[9px] font-extrabold tracking-widest text-amber-300 uppercase">SEP • SEMS • DGETI</p>
            <h1 class="text-base font-black tracking-wider uppercase text-white mt-0.5">CETis No. 116</h1>
            <p class="text-[10px] text-amber-200/90 font-mono tracking-wide mt-1">Control de Acceso • Sistema de Credenciales</p>
        </div>

        <!-- FORMULARIO -->
        <div class="p-6">
            <div class="space-y-4 text-xs">
                <div>
                    <label class="block font-extrabold text-slate-700 uppercase mb-1">Correo Electrónico:</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 font-medium text-slate-900 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block font-extrabold text-slate-700 uppercase mb-1">Contraseña (Mínimo 6 caracteres):</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 font-medium text-slate-900 focus:outline-none focus:border-amber-500">
                </div>

                <div class="pt-2 space-y-2.5">
                    <button type="button" id="btnIngresar" onclick="iniciarSesion()" class="w-full btn-gold font-extrabold py-3.5 rounded-xl shadow-lg uppercase tracking-wider text-xs flex items-center justify-center gap-2 cursor-pointer">
                        <span>🔐</span> Iniciar Sesión
                    </button>

                    <button type="button" id="btnRegistrar" onclick="registrarColaborador()" class="w-full bg-slate-900 text-amber-300 font-extrabold py-3 rounded-xl shadow uppercase tracking-wider text-xs hover:bg-slate-800 transition cursor-pointer border border-amber-500/30 flex items-center justify-center gap-2">
                        <span>✨</span> Registrar Nueva Cuenta
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 text-slate-400 text-center py-3 text-[10px] border-t border-slate-800">
            <p>Admin Propietario: josefranciisco17@gmail.com • By J.F.A.M</p>
        </div>
    </div>

    <!-- MODAL DE ALERTA PERSONALIZADO -->
    <div id="customModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(7, 11, 20, 0.85); z-index: 9999; align-items: center; justify-content: center; padding: 16px;">
        <div class="bg-white border-2 border-[#c59b4d] rounded-2xl w-full max-w-[320px] shadow-2xl overflow-hidden text-center p-5">
            <div class="w-10 h-10 bg-[#4a0e1e] text-amber-300 rounded-full mx-auto flex items-center justify-center text-lg font-bold border border-amber-400 mb-2">
                ✨
            </div>
            <h3 class="text-xs font-black uppercase tracking-wider text-[#4a0e1e] mb-1">CETis No. 116</h3>
            <p id="modalMessage" class="text-xs font-bold text-slate-800 mb-4">Mensaje del sistema</p>
            <button onclick="cerrarModalPersonalizado()" class="w-full btn-gold font-black py-2.5 rounded-xl uppercase text-xs tracking-wider cursor-pointer">
                Aceptar
            </button>
        </div>
    </div>

    <!-- SCRIPT DE AUTENTICACIÓN AUTÓNOMO -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Inicializamos auth directamente desde la app de db para no depender de exportaciones rotas
        const auth = getAuth(db.app);
        const ADMIN_EMAIL = "josefranciisco17@gmail.com";

        window.mostrarAlerta = function(mensaje, callback = null) {
            document.getElementById('modalMessage').innerText = mensaje;
            document.getElementById('customModal').style.display = 'flex';
            window.modalCallback = callback;
        }

        window.cerrarModalPersonalizado = function() {
            document.getElementById('customModal').style.display = 'none';
            if (window.modalCallback) window.modalCallback();
        }

        window.iniciarSesion = async function() {
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                mostrarAlerta("Por favor ingresa tu correo y contraseña.");
                return;
            }

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                const esAdmin = (user.email.toLowerCase() === ADMIN_EMAIL);

                // Guardar llave de sesión igual que en la app de Mantenimiento
                localStorage.setItem("cetis116_user_email", user.email);
                localStorage.setItem("cetis116_user_rol", esAdmin ? "propietario_admin" : "colaborador");

                mostrarAlerta(esAdmin ? "¡Bienvenido Administrador Propietario!" : "¡Acceso concedido al sistema!", () => {
                    window.location.replace("index.html");
                });
            } catch (error) {
                console.error("Error de login:", error);
                mostrarAlerta("Acceso denegado: Verifica tu correo o contraseña.");
            }
        }

        window.registrarColaborador = async function() {
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                mostrarAlerta("Ingresa un correo y una contraseña para crear tu cuenta.");
                return;
            }

            if (password.length < 6) {
                mostrarAlerta("La contraseña debe tener al menos 6 caracteres.");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                const esAdmin = (user.email.toLowerCase() === ADMIN_EMAIL);

                await setDoc(doc(db, "usuarios_sistema", user.uid), {
                    email: user.email,
                    rol: esAdmin ? "propietario_admin" : "colaborador",
                    fechaRegistro: new Date().toISOString()
                });

                // Guardar llave de sesión inmediatamente
                localStorage.setItem("cetis116_user_email", user.email);
                localStorage.setItem("cetis116_user_rol", esAdmin ? "propietario_admin" : "colaborador");

                mostrarAlerta(esAdmin ? "¡Cuenta de Administrador Propietario creada con éxito!" : "¡Cuenta creada y registrada con éxito!", () => {
                    window.location.replace("index.html");
                });
            } catch (error) {
                console.error("Error al registrar:", error);
                if (error.code === "auth/email-already-in-use") {
                    mostrarAlerta("Este correo ya está registrado. Presiona 'Iniciar Sesión'.");
                } else if (error.code === "auth/operation-not-allowed") {
                    mostrarAlerta("Falta habilitar Correo/Contraseña en Firebase > Authentication > Sign-in method.");
                } else {
                    mostrarAlerta("Error al registrar: " + error.message);
                }
            }
        }
    </script>
</body>
</html>
